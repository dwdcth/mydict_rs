[package]
name = "server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MyDict self-hosted dictionary service (Rust rewrite)"

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "mydict"
path = "src/main.rs"

[[bin]]
name = "mydict-cli"
path = "src/bin/cli.rs"

[dependencies]
dict-parser = { path = "../dict-parser" }
mdictlib.workspace = true
zip.workspace = true
# 钉 rc.11：其预编译 onnxruntime(ms@1.23.2) 与 Debian 12 / glibc 2.36 兼容；
# rc.13 捆绑的 ms@1.28.0 需要 glibc>=2.38（__isoc23_* 符号）
ort = { workspace = true }
migration = { path = "../migration" }
actix-web.workspace = true
actix-files.workspace = true
actix-multipart.workspace = true
tokio.workspace = true
futures.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
bcrypt.workspace = true
jsonwebtoken.workspace = true
sha2.workspace = true
aes-gcm.workspace = true
rand.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
moka.workspace = true
regex.workspace = true
fancy-regex.workspace = true
oxideav-speex.workspace = true
tokio-tungstenite.workspace = true
ogg.workspace = true
unicode-normalization.workspace = true
opencc-rs.workspace = true
encoding_rs.workspace = true
lol_html.workspace = true
html-escape.workspace = true
reqwest.workspace = true
thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
base64.workspace = true
mime.workspace = true
typenum.workspace = true
walkdir.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
clap.workspace = true
fsrs = "6.6.2"
kokoro-micro = "1.3.0"

# release_idle_memory 里 malloc_trim 归还 arena 空页给内核（仅 Linux）
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
actix-http = "3"
